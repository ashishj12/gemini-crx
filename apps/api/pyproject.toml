[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-resolution-api"
version = "2.0.0"
description = "Controlled Gemini customer resolution workflows and enterprise adapters"
requires-python = ">=3.11"
dependencies = ["fastapi==0.143.3", "uvicorn==0.54.0", "pydantic==2.14.1", "google-genai==2.31.0", "jsonschema==4.26.0"]

[tool.setuptools.packages.find]
where = ["src"]
